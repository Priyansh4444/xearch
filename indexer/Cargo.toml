[package]
name = "xearch-indexer"
version = "0.1.0"
edition = "2021"
description = "Offline indexer: JSONL ingress -> tokenized/scored batches -> Convex"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
unicode-normalization = "0.1"   # NFKC — the one Unicode dependency both twins rely on via the standard
unicode-general-category = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# golden tests read shared/fixtures/*.jsonl relative to workspace root
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "tokenizer"
harness = false
