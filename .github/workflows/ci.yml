name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-28
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: indexer
      - run: cargo fmt --manifest-path indexer/Cargo.toml -- --check
      - run: cargo clippy --manifest-path indexer/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path indexer/Cargo.toml
